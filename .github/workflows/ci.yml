name: CI

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install
              run: npm ci

            - name: Type check
              run: npm run type-check

            - name: Lint TypeScript and Vue
              run: npm run eslint

            - name: Lint styles
              run: npm run lint:css

            - name: Build library and docs
              run: npm run build

            - name: Validate package contents
              run: npm pack --dry-run
