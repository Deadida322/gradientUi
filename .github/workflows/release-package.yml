name: Release Package

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version bump type
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major
                    - prepatch
                    - preminor
                    - premajor
                    - prerelease
            prerelease-id:
                description: Prerelease identifier
                required: false
                default: rc
            npm-tag:
                description: npm dist-tag
                required: true
                default: latest
                type: choice
                options:
                    - latest
                    - rc
                    - next
                    - beta
            upgrade-notes-path:
                description: Markdown file used as GitHub Release notes
                required: false
                default: UPGRADE_NOTES.md

concurrency:
    group: release-package
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        name: Create release
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.bump.outputs.tag }}
            version: ${{ steps.bump.outputs.version }}
            is_prerelease: ${{ steps.bump.outputs.is_prerelease }}
        permissions:
            contents: write
        timeout-minutes: 45
        env:
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            PLAYWRIGHT_BROWSERS_PATH: 0

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Install npm version used for publishing
              run: npm install --global npm@11.5.1

            - name: Validate release branch
              shell: bash
              run: |
                  if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
                    echo "Releases must run from $DEFAULT_BRANCH, not $GITHUB_REF_NAME"
                    exit 1
                  fi

            - name: Install
              run: npm ci

            - name: Validate package metadata
              shell: bash
              run: |
                  PACKAGE_NAME="$(node -p "require('./package.json').name")"

                  if [ "$PACKAGE_NAME" != "@gradient-ui/core" ]; then
                    echo "Expected package name @gradient-ui/core, got $PACKAGE_NAME"
                    exit 1
                  fi

            - name: Bump version
              id: bump
              shell: bash
              env:
                RELEASE_BUMP: ${{ inputs.version }}
                PRE_RELEASE_ID: ${{ inputs.prerelease-id }}
                NPM_TAG: ${{ inputs.npm-tag }}
              run: |
                  if [[ "$RELEASE_BUMP" == pre* ]]; then
                    npm version "$RELEASE_BUMP" --preid "$PRE_RELEASE_ID" --no-git-tag-version
                  elif [ "$RELEASE_BUMP" = "prerelease" ]; then
                    npm version prerelease --preid "$PRE_RELEASE_ID" --no-git-tag-version
                  else
                    npm version "$RELEASE_BUMP" --no-git-tag-version
                  fi

                  VERSION="$(node -p "require('./package.json').version")"
                  IS_PRERELEASE="$(node -p "require('./package.json').version.includes('-') ? 'true' : 'false'")"

                  if [ "$IS_PRERELEASE" = "true" ] && [ "$NPM_TAG" = "latest" ]; then
                    echo "Prerelease versions must be published with a non-latest npm tag."
                    exit 1
                  fi

                  {
                    echo "version=${VERSION}"
                    echo "tag=v${VERSION}"
                    echo "is_prerelease=${IS_PRERELEASE}"
                  } >> "$GITHUB_OUTPUT"

            - name: Sync workspace package versions
              run: npm run version:sync && npm run version:check

            - name: Install hydration browser
              run: npm exec -- playwright install --with-deps chromium

            - name: Release SSR gate
              run: npm run release:ssr:check

            - name: Commit and tag synchronized versions
              env:
                  TAG: ${{ steps.bump.outputs.tag }}
                  VERSION: ${{ steps.bump.outputs.version }}
              run: |
                  git add package.json package-lock.json packages/gradient-engine/package.json packages/nuxt/package.json packages/figma-plugin/package.json
                  git commit -m "release: ${VERSION}"
                  git tag "$TAG"
                  git push --atomic origin "HEAD:refs/heads/${DEFAULT_BRANCH}" "refs/tags/${TAG}"

    publish:
        name: Publish packages
        needs: release
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment:
            name: npm-publish
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release.outputs.tag }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install npm for trusted publishing
              run: npm install --global npm@11.5.1

            - name: Install
              run: npm ci

            - name: Verify synchronized package versions
              run: npm run version:check

            - name: Publish gradient engine, core and Nuxt module
              run: npm run release:publish -- "${{ inputs.npm-tag }}"

    announce:
        name: Create GitHub Release
        needs:
            - release
            - publish
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            TAG: ${{ needs.release.outputs.tag }}
            VERSION: ${{ needs.release.outputs.version }}
            IS_PRERELEASE: ${{ needs.release.outputs.is_prerelease }}
            NOTES_PATH: ${{ inputs.upgrade-notes-path }}

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release.outputs.tag }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release
              shell: bash
              run: |
                  RELEASE_FLAGS=()
                  if [ "$IS_PRERELEASE" = "true" ]; then
                    RELEASE_FLAGS+=(--prerelease)
                  fi

                  NOTES_FLAGS=(--notes "Release @gradient-ui/core ${VERSION}")
                  if [ -n "$NOTES_PATH" ] && [ -f "$NOTES_PATH" ]; then
                    NOTES_FLAGS=(--notes-file "$NOTES_PATH")
                  fi

                  gh release create "$TAG" \
                    --title "$TAG" \
                    "${NOTES_FLAGS[@]}" \
                    "${RELEASE_FLAGS[@]}"
