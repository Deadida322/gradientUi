name: Release Package

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version bump type
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major
                    - prepatch
                    - preminor
                    - premajor
                    - prerelease
            prerelease-id:
                description: Prerelease identifier
                required: false
                default: rc
            npm-tag:
                description: npm dist-tag
                required: true
                default: latest
                type: choice
                options:
                    - latest
                    - rc
                    - next
                    - beta
            upgrade-notes-path:
                description: Markdown file used as GitHub Release notes
                required: false
                default: UPGRADE_NOTES.md

concurrency:
    group: release-package
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        name: Create release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Install
              run: npm ci

            - name: Validate package metadata
              shell: bash
              run: |
                  PACKAGE_NAME="$(node -p "require('./package.json').name")"

                  if [ "$PACKAGE_NAME" != "@gradient-ui/core" ]; then
                    echo "Expected package name @gradient-ui/core, got $PACKAGE_NAME"
                    exit 1
                  fi

            - name: Validate npm auth
              run: npm whoami
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Bump version
              id: bump
              shell: bash
              run: |
                  if [[ "${{ inputs.version }}" == pre* ]]; then
                    npm version "${{ inputs.version }}" --preid "${{ inputs.prerelease-id }}"
                  elif [ "${{ inputs.version }}" = "prerelease" ]; then
                    npm version prerelease --preid "${{ inputs.prerelease-id }}"
                  else
                    npm version "${{ inputs.version }}"
                  fi

                  VERSION="$(node -p "require('./package.json').version")"
                  IS_PRERELEASE="$(node -p "require('./package.json').version.includes('-') ? 'true' : 'false'")"

                  if [ "$IS_PRERELEASE" = "true" ] && [ "${{ inputs.npm-tag }}" = "latest" ]; then
                    echo "Prerelease versions must be published with a non-latest npm tag."
                    exit 1
                  fi

                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "is-prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

            - name: Resolve upgrade notes
              id: notes
              shell: bash
              run: |
                  NOTES_PATH="${{ inputs.upgrade-notes-path }}"

                  if [ -n "$NOTES_PATH" ] && [ -f "$NOTES_PATH" ]; then
                    echo "path=${NOTES_PATH}" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "Upgrade notes file was not found: ${NOTES_PATH}"
                  echo "path=" >> "$GITHUB_OUTPUT"

            - name: Type check
              run: npm run type-check

            - name: Lint TypeScript and Vue
              run: npm run eslint

            - name: Lint styles
              run: npm run lint:css

            - name: Build
              run: npm run build

            - name: Push version commit and tag
              run: git push --follow-tags

            - name: Publish to npm
              run: npm publish --access public --tag "${{ inputs.npm-tag }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.bump.outputs.tag }}
                  VERSION: ${{ steps.bump.outputs.version }}
              run: |
                  RELEASE_FLAGS=()
                  if [ "${{ steps.bump.outputs.is-prerelease }}" = "true" ]; then
                    RELEASE_FLAGS+=(--prerelease)
                  fi

                  NOTES_FLAGS=(--notes "Release @gradient-ui/core ${VERSION}")
                  if [ -n "${{ steps.notes.outputs.path }}" ]; then
                    NOTES_FLAGS=(--notes-file "${{ steps.notes.outputs.path }}")
                  fi

                  gh release create "$TAG" \
                    --title "$TAG" \
                    "${NOTES_FLAGS[@]}" \
                    "${RELEASE_FLAGS[@]}"
