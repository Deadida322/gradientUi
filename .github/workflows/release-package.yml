name: Release Package

on:
    workflow_dispatch:
        inputs:
            package:
                description: Package to release independently
                required: true
                default: core
                type: choice
                options:
                    - core
                    - gradient-engine
                    - nuxt
            resume-version:
                description: Existing release version to resume without bumping (leave empty for a new release)
                required: false
                default: ''
            version:
                description: Version bump type
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major
                    - prepatch
                    - preminor
                    - premajor
                    - prerelease
            prerelease-id:
                description: Prerelease identifier
                required: false
                default: rc
            npm-tag:
                description: npm dist-tag
                required: true
                default: latest
                type: choice
                options:
                    - latest
                    - rc
                    - next
                    - beta
            upgrade-notes-path:
                description: Markdown file used as GitHub Release notes
                required: false
                default: UPGRADE_NOTES.md

concurrency:
    group: release-package
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        name: Create release
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.bump.outputs.tag }}
            version: ${{ steps.bump.outputs.version }}
            is_prerelease: ${{ steps.bump.outputs.is_prerelease }}
            package_name: ${{ steps.package.outputs.name }}
        permissions:
            contents: write
        timeout-minutes: 45
        env:
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            PLAYWRIGHT_BROWSERS_PATH: 0

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Install npm version used for publishing
              run: npm install --global npm@11.5.1

            - name: Validate release branch
              shell: bash
              run: |
                  if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
                    echo "Releases must run from $DEFAULT_BRANCH, not $GITHUB_REF_NAME"
                    exit 1
                  fi

            - name: Install
              run: npm ci

            - name: Select release package
              id: package
              shell: bash
              env:
                  RELEASE_PACKAGE: ${{ inputs.package }}
              run: |
                  case "$RELEASE_PACKAGE" in
                    core) PACKAGE_PATH=package.json; TAG_PREFIX=v ;;
                    gradient-engine) PACKAGE_PATH=packages/gradient-engine/package.json; TAG_PREFIX=gradient-engine-v ;;
                    nuxt) PACKAGE_PATH=packages/nuxt/package.json; TAG_PREFIX=nuxt-v ;;
                    *) echo "Unknown release package: $RELEASE_PACKAGE"; exit 1 ;;
                  esac
                  PACKAGE_NAME="$(node -p "require('./${PACKAGE_PATH}').name")"
                  if [ "$PACKAGE_NAME" != "@gradient-ui/${RELEASE_PACKAGE}" ]; then
                    echo "Unexpected package name: $PACKAGE_NAME"
                    exit 1
                  fi
                  {
                    echo "path=$PACKAGE_PATH"
                    echo "name=$PACKAGE_NAME"
                    echo "prefix=$TAG_PREFIX"
                  } >> "$GITHUB_OUTPUT"

            - name: Bump version
              id: bump
              shell: bash
              env:
                  RELEASE_BUMP: ${{ inputs.version }}
                  PRE_RELEASE_ID: ${{ inputs.prerelease-id }}
                  NPM_TAG: ${{ inputs.npm-tag }}
                  RESUME_VERSION: ${{ inputs.resume-version }}
                  PACKAGE_PATH: ${{ steps.package.outputs.path }}
                  PACKAGE_NAME: ${{ steps.package.outputs.name }}
                  TAG_PREFIX: ${{ steps.package.outputs.prefix }}
                  RELEASE_PACKAGE: ${{ inputs.package }}
              run: |
                  WORKSPACE_ARGS=()
                  if [ "$RELEASE_PACKAGE" != "core" ]; then
                    WORKSPACE_ARGS=(--workspace "$PACKAGE_NAME")
                  fi
                  if [ -n "$RESUME_VERSION" ]; then
                    CURRENT_VERSION="$(node -p "require('./${PACKAGE_PATH}').version")"
                    if [ "$RESUME_VERSION" != "$CURRENT_VERSION" ]; then
                      echo "Resume version must match the checked-out package version: $CURRENT_VERSION"
                      exit 1
                    fi
                    git rev-parse --verify "refs/tags/${TAG_PREFIX}${RESUME_VERSION}"
                    git diff --exit-code "${TAG_PREFIX}${RESUME_VERSION}" HEAD -- "$PACKAGE_PATH"
                  elif [[ "$RELEASE_BUMP" == pre* ]]; then
                    npm version "$RELEASE_BUMP" --preid "$PRE_RELEASE_ID" --no-git-tag-version "${WORKSPACE_ARGS[@]}"
                  elif [ "$RELEASE_BUMP" = "prerelease" ]; then
                    npm version prerelease --preid "$PRE_RELEASE_ID" --no-git-tag-version "${WORKSPACE_ARGS[@]}"
                  else
                    npm version "$RELEASE_BUMP" --no-git-tag-version "${WORKSPACE_ARGS[@]}"
                  fi

                  VERSION="$(node -p "require('./${PACKAGE_PATH}').version")"
                  IS_PRERELEASE="$(node -p "require('./${PACKAGE_PATH}').version.includes('-') ? 'true' : 'false'")"

                  if [ "$IS_PRERELEASE" = "true" ] && [ "$NPM_TAG" = "latest" ]; then
                    echo "Prerelease versions must be published with a non-latest npm tag."
                    exit 1
                  fi

                  {
                    echo "version=${VERSION}"
                    echo "tag=${TAG_PREFIX}${VERSION}"
                    echo "is_prerelease=${IS_PRERELEASE}"
                  } >> "$GITHUB_OUTPUT"

            - name: Sync lockfile metadata and check workspace compatibility
              run: npm run version:sync && npm run version:check

            - name: Install hydration browser
              run: npm exec -- playwright install --with-deps chromium

            - name: Release SSR gate
              run: npm run release:ssr:check

            - name: Validate npm publish lifecycles
              run: npm run release:publish -- "${{ inputs.npm-tag }}" --package "${{ inputs.package }}" --dry-run

            - name: Commit and tag selected package version
              if: inputs.resume-version == ''
              env:
                  TAG: ${{ steps.bump.outputs.tag }}
                  VERSION: ${{ steps.bump.outputs.version }}
                  PACKAGE_PATH: ${{ steps.package.outputs.path }}
                  PACKAGE_NAME: ${{ steps.package.outputs.name }}
              run: |
                  git add "$PACKAGE_PATH" package-lock.json
                  git commit -m "release: ${PACKAGE_NAME}@${VERSION}"
                  git tag "$TAG"
                  git push --atomic origin "HEAD:refs/heads/${DEFAULT_BRANCH}" "refs/tags/${TAG}"

    publish:
        name: Publish packages
        needs: release
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment:
            name: npm-publish
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release.outputs.tag }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install npm for trusted publishing
              run: npm install --global npm@11.5.1

            - name: Install
              run: npm ci

            - name: Verify workspace compatibility
              run: npm run version:check

            - name: Build local workspace dependencies
              run: npm run build:lib

            - name: Checkout current publishing script
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  path: .release-publisher
                  sparse-checkout: scripts/publish-workspaces.mjs
                  sparse-checkout-cone-mode: false

            - name: Publish selected package
              env:
                  NPM_TAG: ${{ inputs.npm-tag }}
                  RELEASE_PACKAGE: ${{ inputs.package }}
              run: node .release-publisher/scripts/publish-workspaces.mjs "$NPM_TAG" --package "$RELEASE_PACKAGE"

    announce:
        name: Create GitHub Release
        needs:
            - release
            - publish
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            TAG: ${{ needs.release.outputs.tag }}
            VERSION: ${{ needs.release.outputs.version }}
            PACKAGE_NAME: ${{ needs.release.outputs.package_name }}
            IS_PRERELEASE: ${{ needs.release.outputs.is_prerelease }}
            NOTES_PATH: ${{ inputs.upgrade-notes-path }}

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release.outputs.tag }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release
              shell: bash
              run: |
                  RELEASE_FLAGS=()
                  if [ "$IS_PRERELEASE" = "true" ]; then
                    RELEASE_FLAGS+=(--prerelease)
                  fi

                  NOTES_FLAGS=(--notes "Release ${PACKAGE_NAME} ${VERSION}")
                  if [ -n "$NOTES_PATH" ] && [ -f "$NOTES_PATH" ]; then
                    NOTES_FLAGS=(--notes-file "$NOTES_PATH")
                  fi

                  gh release create "$TAG" \
                    --title "$TAG" \
                    "${NOTES_FLAGS[@]}" \
                    "${RELEASE_FLAGS[@]}"
