name: Publish Package

on:
    release:
        types:
            - published

concurrency:
    group: publish-package
    cancel-in-progress: false

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install
              run: npm ci

            - name: Validate release package metadata
              shell: bash
              run: |
                  PACKAGE_NAME="$(node -p "require('./package.json').name")"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  RELEASE_TAG="${GITHUB_REF_NAME}"

                  if [ "$PACKAGE_NAME" != "@gradient-ui/core" ]; then
                    echo "Expected package name @gradient-ui/core, got $PACKAGE_NAME"
                    exit 1
                  fi

                  if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
                    echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
                    exit 1
                  fi

            - name: Type check
              run: npm run type-check

            - name: Lint TypeScript and Vue
              run: npm run eslint

            - name: Lint styles
              run: npm run lint:css

            - name: Build library
              run: npm run build:lib

            - name: Check npm version
              id: npm-version
              shell: bash
              run: |
                  PACKAGE_NAME="$(node -p "require('./package.json').name")"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  NPM_TAG="$(node -p "const version = require('./package.json').version; const match = version.match(/-([0-9A-Za-z]+)(?:\\.|$)/); match ? match[1] : 'latest'")"

                  if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
                    echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published."
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                  fi

                  echo "tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

            - name: Publish
              if: steps.npm-version.outputs.published != 'true'
              run: npm publish --access public --tag "${{ steps.npm-version.outputs.tag }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
