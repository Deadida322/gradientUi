name: Publish Package

on:
    release:
        types:
            - published

concurrency:
    group: publish-package
    cancel-in-progress: false

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install
              run: npm ci

            - name: Validate release package metadata
              shell: bash
              run: |
                  PACKAGE_NAME="$(node -p "require('./package.json').name")"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  RELEASE_TAG="${GITHUB_REF_NAME}"

                  if [ "$PACKAGE_NAME" != "@gradient-ui/core" ]; then
                    echo "Expected package name @gradient-ui/core, got $PACKAGE_NAME"
                    exit 1
                  fi

                  if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
                    echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
                    exit 1
                  fi

            - name: Type check
              run: npm run type-check

            - name: Lint TypeScript and Vue
              run: npm run eslint

            - name: Lint styles
              run: npm run lint:css

            - name: Build library
              run: npm run build:lib

            - name: Publish
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
